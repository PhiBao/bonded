<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonded architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper: #f3eee4;
    --ink: #15120f;
    --muted: #6d6357;
    --rule: #cec2af;
    --green: #1d5a47;
    --red: #c42c39;
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1100px; width: 100%; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .66rem;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .5rem;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(1.7rem, 2.4vw + .8rem, 2.4rem);
    font-weight: 500;
    letter-spacing: -.03em;
    line-height: 1.05;
    margin-bottom: 1.5rem;
  }
  .diagram-container { width: 100%; overflow-x: auto; }
  svg { width: 100%; min-width: 960px; display: block; }
  @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Architecture · Bonded</p>
  <h1>One accountable loop, from payment to slash.</h1>
  <div class="diagram-container">
    <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bonded-arch-title bonded-arch-desc">
      <title id="bonded-arch-title">Bonded architecture</title>
      <desc id="bonded-arch-desc">A buyer funds a job in a NEAR contract, a bonded agent submits a patch, a temp-directory evaluator runs the acceptance test, TypeSafe reviews the patch, and the contract settles or slashes the bond.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6d6357"/></marker>
        <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d5a47"/></marker>
        <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c42c39"/></marker>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="rgba(21,18,15,.08)"/></pattern>
      </defs>
      <rect width="100%" height="100%" fill="#f3eee4"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity=".5"/>

      <!-- boundaries -->
      <rect x="688" y="86" width="214" height="130" rx="8" fill="none" stroke="#cec2af" stroke-dasharray="4 4"/>
      <text x="700" y="80" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing=".12em" fill="#6d6357">NEAR TESTNET</text>

      <!-- arrows first -->
      <!-- buyer -> api -->
      <path d="M250 152 H380" fill="none" stroke="#6d6357" stroke-width="1.4" marker-end="url(#arrow)"/>
      <rect x="286" y="134" width="58" height="16" fill="#f3eee4"/>
      <text x="315" y="146" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing=".08em" fill="#6d6357">FUND</text>

      <!-- agent -> api -->
      <path d="M250 342 H380" fill="none" stroke="#6d6357" stroke-width="1.4" marker-end="url(#arrow)"/>
      <rect x="282" y="324" width="66" height="16" fill="#f3eee4"/>
      <text x="315" y="336" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing=".08em" fill="#6d6357">PATCH</text>

      <!-- api -> contract (elbow up) -->
      <path d="M580 225 H650 V153 H700" fill="none" stroke="#1d5a47" stroke-width="1.6" marker-end="url(#arrow-green)"/>
      <rect x="592" y="203" width="52" height="16" fill="#f3eee4"/>
      <text x="618" y="215" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing=".08em" fill="#1d5a47">BOND</text>

      <!-- api -> evaluator (elbow down) -->
      <path d="M580 255 H650 V313 H700" fill="none" stroke="#6d6357" stroke-width="1.4" marker-end="url(#arrow)"/>
      <rect x="594" y="259" width="42" height="16" fill="#f3eee4"/>
      <text x="615" y="271" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing=".08em" fill="#6d6357">TEST</text>

      <!-- evaluator -> typesafe -->
      <path d="M815 361 V425" fill="none" stroke="#6d6357" stroke-width="1.4" marker-end="url(#arrow)"/>
      <rect x="823" y="382" width="58" height="16" fill="#f3eee4"/>
      <text x="852" y="394" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing=".08em" fill="#6d6357">REVIEW</text>

      <!-- nodes -->
      <!-- buyer -->
      <rect x="60" y="110" width="190" height="84" rx="6" fill="#fffdf8" stroke="#15120f" stroke-width="1.2"/>
      <rect x="60" y="110" width="58" height="18" rx="2" fill="#e9e2d4"/>
      <text x="70" y="123" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing=".1em" fill="#6d6357">BUYER</text>
      <text x="76" y="158" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#15120f">Next.js job page</text>
      <text x="76" y="176" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6d6357">funds the job · sees the bond</text>

      <!-- agent -->
      <rect x="60" y="300" width="190" height="84" rx="6" fill="#fffdf8" stroke="#15120f" stroke-width="1.2"/>
      <rect x="60" y="300" width="58" height="18" rx="2" fill="#e9e2d4"/>
      <text x="70" y="313" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing=".1em" fill="#6d6357">AGENT</text>
      <text x="76" y="348" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#15120f">Forge / Sable</text>
      <text x="76" y="366" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6d6357">patch · bond at risk</text>

      <!-- api -->
      <rect x="380" y="195" width="200" height="96" rx="6" fill="#fffdf8" stroke="#15120f" stroke-width="1.6"/>
      <rect x="380" y="195" width="58" height="18" rx="2" fill="#dbe7df"/>
      <text x="390" y="208" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing=".1em" fill="#1d5a47">RUST API</text>
      <text x="398" y="240" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#15120f">Axum + SQLite</text>
      <text x="398" y="258" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6d6357">jobs · bids · receipts</text>
      <text x="398" y="274" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6d6357">role signers</text>

      <!-- contract -->
      <rect x="700" y="105" width="190" height="96" rx="6" fill="#fffdf8" stroke="#1d5a47" stroke-width="1.8"/>
      <rect x="700" y="105" width="58" height="18" rx="2" fill="#dbe7df"/>
      <text x="710" y="118" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing=".1em" fill="#1d5a47">CONTRACT</text>
      <text x="716" y="150" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#15120f">Bonded escrow</text>
      <text x="716" y="168" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6d6357">budget · bond · slash</text>
      <text x="716" y="184" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6d6357">source of truth</text>

      <!-- evaluator -->
      <rect x="700" y="265" width="190" height="96" rx="6" fill="#fffdf8" stroke="#15120f" stroke-width="1.2"/>
      <rect x="700" y="265" width="58" height="18" rx="2" fill="#e9e2d4"/>
      <text x="710" y="278" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing=".1em" fill="#6d6357">EVALUATOR</text>
      <text x="716" y="310" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#15120f">Temp-dir test run</text>
      <text x="716" y="328" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6d6357">npm test · signed logs</text>
      <text x="716" y="344" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6d6357">temp dir · 40s timeout</text>

      <!-- typesafe -->
      <rect x="700" y="425" width="190" height="84" rx="6" fill="#fffdf8" stroke="#c42c39" stroke-width="1.4"/>
      <rect x="700" y="425" width="64" height="18" rx="2" fill="#f0d9d8"/>
      <text x="710" y="438" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing=".1em" fill="#c42c39">TYPESAFE</text>
      <text x="716" y="463" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#15120f">Jev decision model</text>
      <text x="716" y="481" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6d6357">real fix · test manipulation</text>

      <!-- note -->
      <text x="60" y="500" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6d6357">The API signs as buyer, agent and evaluator on testnet. The contract, not the API, enforces the money.</text>
      <line x1="60" y1="516" x2="900" y2="516" stroke="#cec2af"/>
      <text x="60" y="538" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6d6357">Green = value locked or paid · Red = semantic review · Dashed = return path</text>
    </svg>
  </div>
</div>
</body>
</html>
