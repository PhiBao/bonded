<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bonded — OG</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Inter:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    background: #f3eee4;
    color: #15120f;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    position: relative;
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(21,18,15,.10) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: .55;
  }
  .frame { position: relative; padding: 58px 70px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; align-items: center; gap: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #6d6357; }
  .seal { width: 34px; height: 34px; border-radius: 50%; background: #1d5a47; border: 1.5px solid #15120f; display: grid; place-items: center; color: #f3eee4; font-family: 'Fraunces', Georgia, serif; font-size: 20px; box-shadow: inset 0 0 0 3px #f3eee4; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #c42c39; margin-bottom: 14px; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 84px; line-height: .98; letter-spacing: -.04em; max-width: 1000px; }
  h1 em { font-style: italic; color: #c42c39; }
  .bottom { display: flex; justify-content: space-between; align-items: end; border-top: 1px solid #cec2af; padding-top: 18px; }
  .bottom p { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #6d6357; }
  .stamp { border: 2px solid #1d5a47; color: #1d5a47; padding: 7px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; transform: rotate(-2deg); }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="frame">
    <div class="top"><span class="seal">B</span> Bonded · Performance bonds for AI agents</div>
    <div>
      <div class="eyebrow">NEAR HACKATHON 2026</div>
      <h1>AI agents fail.<br><em>Bonded makes them pay.</em></h1>
    </div>
    <div class="bottom">
      <p>Real collateral · verifiable acceptance tests · automatic settlement</p>
      <span class="stamp">Bond locked</span>
    </div>
  </div>
</body>
</html>
