[package]
name = "bonded-contract"
version = "0.1.0"
edition = "2021"
description = "Bonded: performance bonds for AI agents"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
unit-testing = ["near-sdk/unit-testing"]

[dependencies]
near-sdk = "5.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
